services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CORS_ORIGINS: http://localhost:8080
      ENABLE_EVALUATION_COLLECTION: ${ENABLE_EVALUATION_COLLECTION:-false}
    volumes:
      - ./research/user_evaluation:/app/research/user_evaluation
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
